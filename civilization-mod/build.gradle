plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
    maven {
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}
dependencies {
    // Optional client integration; never bundle JEI or require it on the server.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // dev.ps1 downloads the pinned Sable release and the libraries it bundles into .dev-libs.
    implementation files(".dev-libs/sable-neoforge-${minecraft_version}-${sable_version}.jar")
    compileOnly fileTree(dir: '.dev-libs', include: ['sable-companion-*.jar', 'veil-*.jar'])
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'it.unimi.dsi:fastutil:8.5.12'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
tasks.named('test') { useJUnitPlatform() }

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.gameTestImplementation.extendsFrom(configurations.implementation)
configurations.gameTestCompileOnly.extendsFrom(configurations.compileOnly)

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.gameTest)

    runs {
        client {
            client()
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('runs/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'civilization'
        }
        // Hidden 1920x1080 clients: a scene, and the peer that some scenes need as a second player.
        visualClient {
            client()
            gameDirectory = project.file('runs/visual')
            systemProperty 'civilization.previewCheck', providers.gradleProperty('visualScene').getOrElse('machines')
            systemProperty 'civilization.visualFull', providers.gradleProperty('visualFull').getOrElse('false')
            systemProperty 'civilization.visualHeadless', 'true'
            programArguments.addAll('--mixin', 'civilization.visual.mixins.json', '--width', '1920', '--height', '1080')
        }
        // The performance benchmark: a hidden 2560x1440 client laid out from the player pack (dev.ps1 Perf), with the
        // pack's memory and the flight recorder its report profiles with.
        perfClient {
            client()
            gameDirectory = project.file('runs/perf')
            systemProperty 'civilization.previewCheck', 'perf'
            systemProperty 'civilization.visualHeadless', 'true'
            jvmArguments.addAll('-Xms512m', '-Xmx8192m', '--add-modules=jdk.jfr')
            programArguments.addAll('--mixin', 'civilization.visual.mixins.json', '--mixin', 'civilization.perf.mixins.json', '--width', '2560', '--height', '1440')
        }
        peerClient {
            client()
            gameDirectory = project.file('runs/peer')
            systemProperty 'civilization.previewCheck', providers.gradleProperty('peerScene').getOrElse('')
            systemProperty 'civilization.visualHeadless', 'true'
            programArguments.addAll('--mixin', 'civilization.visual.mixins.json', '--width', '1920', '--height', '1080', '--username', 'Peer')
        }
        // Save/restart checks that need separate server processes (boat, airship, thermal laboratory).
        fixtureServer {
            server()
            gameDirectory = project.file('runs/fixture')
            programArgument '--nogui'
            systemProperty 'civilization.fixture', providers.gradleProperty('fixture').getOrElse('')
            systemProperty 'civilization.fixturePhase', providers.gradleProperty('fixturePhase').getOrElse('')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

// JavaExec otherwise closes stdin, making the server's stop command unusable.
tasks.named('runServer', JavaExec) { standardInput = System.in }
tasks.named('runFixtureServer', JavaExec) {
    standardInput = System.in
    if (providers.gradleProperty('fixturePhase').getOrElse('') != 'manual') timeout = java.time.Duration.ofMinutes(10)
}
tasks.named('runVisualClient', JavaExec) { timeout = java.time.Duration.ofMinutes(6) }
tasks.named('runPeerClient', JavaExec) { timeout = java.time.Duration.ofMinutes(6) }
// Long enough for the first run, which also generates the benchmark world.
tasks.named('runPerfClient', JavaExec) { timeout = java.time.Duration.ofMinutes(60) }

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        minecraft_version: minecraft_version,
        neo_version: neo_version,
        geckolib_version: geckolib_version
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Use Gradle's resolved artifact for Prism deployment rather than a second download path.
tasks.register('prepareRuntimeMods', Copy) {
    from(configurations.runtimeClasspath) { include 'geckolib-neoforge-*.jar' }
    into layout.buildDirectory.dir('runtimeMods')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('TEMPLATE_LICENSE.txt')
}
