plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
tasks.named('test') { useJUnitPlatform() }

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.gameTestImplementation.extendsFrom(configurations.implementation)

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.gameTest)

    runs {
        client {
            client()
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('runs/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'civilization'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

// JavaExec otherwise closes stdin, making the dedicated server's stop command unusable.
tasks.named('runServer', JavaExec) {
    standardInput = System.in
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        minecraft_version: minecraft_version,
        neo_version: neo_version
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('TEMPLATE_LICENSE.txt')
}

