modLoader="javafml"
loaderVersion="[4,)"
license="All Rights Reserved"

[[mixins]]
config="civilization.mixins.json"

# Lithium treats every collidable entity as its bounding box when it gathers entity collisions for
# movement and intersection checks, so wheelbarrows would block far beyond their body. Its supported
# per-mod override keeps both on the vanilla path, where carriers supply their measured surfaces.
["lithium:options"]
"mixin.entity.collisions.movement"=false
"mixin.entity.collisions.intersection"=false

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Custom civilization gameplay: energy, production, ownership, and infrastructure.
Single calorie food system with distance-based movement costs, labor, healing, and a custom HUD.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},21.2)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version}]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="required"
versionRange="[2.0.5]"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="civilization.dh.mixins.json"

[[mixins]]
config="civilization.c2me.mixins.json"

[[mixins]]
config="civilization.grassiergrass.mixins.json"
