# /etc/nginx/conf.d/minecraft-map.conf (http context)
limit_req_zone $binary_remote_addr zone=map_requests:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=map_clients:1m;
limit_conn_zone $server_name zone=map_total:1m;

server {
    # The deploy script writes the map port from its local configuration here.
    listen MAP_PORT default_server;
    server_name _;
    server_tokens off;
    autoindex off;
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 10s;
    keepalive_timeout 10s;
    keepalive_requests 100;
    large_client_header_buffers 2 4k;
    # One full viewport can request 196 tiles in each of two layers.
    limit_req zone=map_requests burst=512 nodelay;
    limit_req_status 429;
    limit_conn map_clients 20;
    limit_conn map_total 32;
    limit_conn_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    # No uploads, management routes, directory browsing or arbitrary files.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ~ "^/(?:|index\.html|map\.js|api/(?:coverage|overviews|players|deposits|villages|metrics)|tiles/r\.-?[0-9]{1,8}\.-?[0-9]{1,8}\.(?:png|relief\.png|elevation\.png|contours\.png|height\.bin)|overviews/[1-8]/r\.-?[0-9]{1,8}\.-?[0-9]{1,8}\.(?:png|relief\.png|elevation\.png|contours\.png))$" {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.0;
        proxy_set_header Host localhost;
        proxy_set_header Connection close;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 5s;
        proxy_hide_header X-Content-Type-Options;
        proxy_max_temp_file_size 0;
    }
    location / { return 404; }
}
